spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: embedded
  data:
    redis:
      host: localhost
      port: 6379

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: docgen-test

jwt:
  secret: test-secret-key-for-testing-purposes-only-256bit
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

encryption:
  # Base64-encoded 32-byte AES-256 key (required by EncryptionServiceImpl).
  key: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

docxtemplater:
  service-url: http://localhost:3000

# OnlyOffice JWT signing key must meet JJWT HMAC minimum length (>= 256 bits).
onlyoffice:
  jwt-secret: test-onlyoffice-jwt-hmac-key-32bytes-minimum!!
