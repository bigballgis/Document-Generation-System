server:
  port: ${SERVER_PORT:8080}

# Outbound HTTP client defaults (used by the shared RestTemplate bean)
http:
  client:
    connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_CLIENT_READ_TIMEOUT_MS:120000}

# Outbound URL policy for mitigating SSRF in server-side HTTP fetches (deny-by-default host allowlist).
# Integrate this policy at call sites (OnlyOffice callbacks, webhooks, etc.) in dedicated task cards.
url-policy:
  allow-private-addresses: ${URL_POLICY_ALLOW_PRIVATE_ADDRESSES:false}
  # Deny-by-default: populate allowed hosts in environment-specific configuration.
  allowed-hosts: []
  allowed-ports:
    - 80
    - 443
  webhook-require-https: ${URL_POLICY_WEBHOOK_REQUIRE_HTTPS:true}

spring:
  application:
    name: docgen-backend

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docgen}
    username: ${DB_USERNAME:docgen}
    password: ${DB_PASSWORD:docgen}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # Mail
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MinIO (minioadmin defaults are rejected in prod profile; see ProductionSecretGuard)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # External endpoint used for presigned URLs (must be reachable by OnlyOffice)
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:docgen}

# JWT (defaults are rejected when spring.profiles.active includes prod or production; see ProductionSecretGuard)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:7200000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# OAuth2 Resource Server (disabled by default)
oauth2:
  enabled: ${OAUTH2_ENABLED:false}
  issuer-uri: ${OAUTH2_ISSUER_URI:}
  jwk-set-uri: ${OAUTH2_JWK_SET_URI:}

# Encryption (defaults are rejected in prod profile; see ProductionSecretGuard)
encryption:
  key: ${ENCRYPTION_KEY:your-aes-256-encryption-key-change-me}

# Docxtemplater Service
docxtemplater:
  service-url: ${DOCXTEMPLATER_SERVICE_URL:http://localhost:3000}

# OnlyOffice (default jwt-secret is rejected in prod profile; see ProductionSecretGuard)
onlyoffice:
  url: ${ONLYOFFICE_URL:http://localhost}
  jwt-secret: ${ONLYOFFICE_JWT_SECRET:my_jwt_secret}
  callback:
    require-jwt: ${ONLYOFFICE_CALLBACK_REQUIRE_JWT:true}
    # Comma-separated list is supported by Spring when bound as List<String>.
    # Keep this aligned with your OnlyOffice Document Server base URL host.
    allowed-hosts: ${ONLYOFFICE_CALLBACK_ALLOWED_HOSTS:}
    max-download-bytes: ${ONLYOFFICE_CALLBACK_MAX_DOWNLOAD_BYTES:20971520}
    # Main template callback returns JSON {"error":0} on success/ack and {"error":1} when a save
    # was rejected (invalid JWT, disallowed download URL, empty download, missing template).

# Composite template ZIP import limits (defense in depth; see CompositeImportExportService#importFromZip)
composite-import:
  zip:
    max-archive-bytes: ${COMPOSITE_IMPORT_ZIP_MAX_ARCHIVE_BYTES:52428800}
    max-total-uncompressed-bytes: ${COMPOSITE_IMPORT_ZIP_MAX_TOTAL_UNCOMPRESSED_BYTES:104857600}
    max-entry-count: ${COMPOSITE_IMPORT_ZIP_MAX_ENTRY_COUNT:512}
    max-entry-bytes: ${COMPOSITE_IMPORT_ZIP_MAX_ENTRY_BYTES:20971520}
    max-uncompressed-to-compressed-ratio: ${COMPOSITE_IMPORT_ZIP_MAX_RATIO:100}

# Document Storage
document:
  temp-cleanup-hours: ${DOCUMENT_TEMP_CLEANUP_HOURS:24}
  storage:
    default-strategy: ${DOCUMENT_STORAGE_STRATEGY:TEMP}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true

# External service monitoring
monitoring:
  check-interval-ms: ${MONITORING_CHECK_INTERVAL_MS:30000}

# Audit Log
audit:
  retention-days: ${AUDIT_RETENTION_DAYS:365}

# Logging
logging:
  level:
    com.docgen: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
