services:
  # Vue 3 frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    image: docgen-frontend:latest
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  # Spring Boot backend
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    image: docgen-app:latest
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=docgen
      - DB_USERNAME=docgen
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DOCXTEMPLATER_SERVICE_URL=http://docxtemplater:3000
      - ONLYOFFICE_URL=http://onlyoffice
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAIL_HOST=${MAIL_HOST:-smtp.example.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      docxtemplater:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Node.js Docxtemplater service (includes LibreOffice)
  docxtemplater:
    build:
      context: ./docxtemplater-service
      dockerfile: Dockerfile
    image: docgen-docxtemplater:latest
    ports:
      - "3000:3000"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-5000}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-64}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M

  # Euro-Office Document Server (FOSS fork of OnlyOffice)
  onlyoffice:
    # Digest-pinned (WS-08-T01); see docs/audits/full-project-review-2026-04-26/23-docker-image-pinning-ws-08-t01.md
    image: ghcr.io/euro-office/documentserver@sha256:8e78211dd45407c92d5f60193ecb3f23be371fd3a359a65bef2f9310f09b3d0b
    ports:
      - "8443:443"
      - "8088:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - ./onlyoffice-plugins/insert-text:/var/www/onlyoffice/documentserver/sdkjs-plugins/insert-text
      - ./onlyoffice-plugins/v1:/var/www/onlyoffice/documentserver/sdkjs-plugins/v1
      - ./onlyoffice-fixes/device_scale.js:/var/www/onlyoffice/documentserver/sdkjs/common/device_scale.js
      - ./onlyoffice-fixes/local-override.json:/etc/onlyoffice/documentserver/local-development-linux.json
    depends_on:
      - app
      - minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # PostgreSQL
  postgres:
    image: postgres:16.5
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=docgen
      - POSTGRES_USER=docgen
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen -d docgen"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Redis
  redis:
    image: redis:7.2.7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # MinIO object storage
  minio:
    # Pinned MinIO server release (WS-08-T01); see docs/audits/full-project-review-2026-04-26/23-docker-image-pinning-ws-08-t01.md
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  onlyoffice_data:
