apiVersion: apps/v1
kind: Deployment
metadata:
  name: docgen-frontend
  namespace: docgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docgen-frontend
  template:
    metadata:
      labels:
        app: docgen-frontend
    spec:
      containers:
        - name: frontend
          # TODO: 替换为公司私有镜像仓库地址
          image: docgen-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://docgen-backend:8080"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
