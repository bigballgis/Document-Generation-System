apiVersion: apps/v1
kind: Deployment
metadata:
  name: docgen-minio
  namespace: docgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docgen-minio
  template:
    metadata:
      labels:
        app: docgen-minio
    spec:
      containers:
        - name: minio
          # TODO: 替换为公司私有镜像仓库地址
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: docgen-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docgen-secrets
                  key: MINIO_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: docgen-minio-pvc
